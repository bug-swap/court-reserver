name: Reserve CU court

on:
  schedule:
    # 00:07 and 00:17 in Denver use different UTC hours across DST.
    - cron: '7,17 6,7 * * *'
    # Visit EMS every four hours to refresh a renewable session.
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto, book, keepalive, or dry-run'
        required: true
        default: dry-run
        type: choice
        options: [dry-run, keepalive, book, auto]

concurrency:
  group: cu-court-reservation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reserve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STATE_KEY: ${{ secrets.STATE_KEY }}
      EMS_INITIAL_STATE: ${{ secrets.EMS_INITIAL_STATE }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      CONTACT_NAME: ${{ secrets.CONTACT_NAME }}
      CONTACT_PHONE: ${{ secrets.CONTACT_PHONE }}
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      MODE: ${{ github.event.inputs.mode || 'auto' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Visit EMS and reserve court
        run: npm run run
