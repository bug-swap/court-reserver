name: Reserve CU court

on:
  schedule:
    # Start away from Canvas's top-of-hour jobs and half-hour submission watcher.
    # These two UTC hours cover midnight across Mountain daylight saving changes.
    - cron: '15,45 6,7 * * *'
    # Extra early-morning attempts in case EMS is unavailable at midnight.
    - cron: '15 8-10 * * *'
    # Every four hours: retry an unbooked date, or refresh a booked session.
    - cron: '15 */4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto, book, keepalive, dry-run, or slots'
        required: true
        default: dry-run
        type: choice
        options: [dry-run, keepalive, book, auto, slots]
      date:
        description: 'Optional YYYY-MM-DD (today or tomorrow); default tomorrow'
        required: false
      sport:
        description: 'Optional squash or badminton; books exactly this, with no fallback'
        required: false
      start_time:
        description: 'Optional HH:MM start time'
        required: false
      badminton_room:
        description: 'Optional 3A, 3B, 3C, or any'
        required: false

concurrency:
  group: cu-court-reservation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reserve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STATE_KEY: ${{ secrets.STATE_KEY }}
      EMS_INITIAL_STATE: ${{ secrets.EMS_INITIAL_STATE }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      CONTACT_NAME: ${{ secrets.CONTACT_NAME }}
      CONTACT_PHONE: ${{ secrets.CONTACT_PHONE }}
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      MODE: ${{ github.event.inputs.mode || 'auto' }}
      TARGET_DATE: ${{ github.event.inputs.date }}
      SPORT: ${{ github.event.inputs.sport }}
      START_TIME: ${{ github.event.inputs.start_time }}
      BADMINTON_ROOM: ${{ github.event.inputs.badminton_room }}
      # A slot picked on the settings page is booked exactly as chosen.
      SQUASH_FALLBACK: ${{ github.event.inputs.sport && 'none' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Visit EMS and reserve court
        run: xvfb-run -a env HEADLESS=false npm run run
